[project]
name = "triage-agent"
version = "0.1.0"
description = "AI agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mezni", email = "mamezni@gmail.com" }
]
dependencies = [
    "anthropic",
    "pydantic>=2",
]

[project.scripts]
triage = "triage_agent.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "triage_agent"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
